<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Menu Basisschool Het Park</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="scherm">
  <header>
    <div>
      <div class="merk">Basisschool Het Park</div>
      <div class="titel">Menu</div>
    </div>
    <div class="vandaag" id="vandaag"></div>
  </header>

  <main id="inhoud">
    <noscript><p class="leeg">Zet JavaScript aan om het menu te tonen.</p></noscript>
  </main>

  <footer>
    <span>Volledig maandmenu op www.basisschoolhetpark.be</span>
    <span class="dim">Bijgewerkt op 4 oktober 2026</span>
  </footer>
</div>

<script>
const DATA = {"bijgewerkt_op": "2026-10-04", "bron": "Maandmenu Oktober", "dagen": [{"datum": "2026-09-28", "items": ["Preisoep", "Kipdonut", "Rozemarijnjus", "Andijvie", "Boterboontjes", "Gestoomde aardappelen"], "veggie": ["Falafel"]}, {"datum": "2026-09-29", "items": ["Pastinaaksoep", "Ham", "Kaassaus", "Bloemkool", "Pasta"], "veggie": ["Provençaals stoofpotje met Gyros"]}, {"datum": "2026-10-01", "items": ["Tomatensoep", "Vol au vent", "Koolsla", "Wortelen", "Gebakken aardappelen"], "veggie": ["Vege vol au vent"]}, {"datum": "2026-10-02", "items": ["Brunoise soep", "Rundsburger", "Demi-glace saus", "Broccoli in witte saus", "Ratatouille", "Aardappelpuree"], "veggie": ["Vege worst"]}, {"datum": "2026-10-05", "items": ["Preisoep", "Kalkoen cordon blue", "Jus natuur", "Groentemengeling/wittesaus", "Gestoofde Erwten", "Krielaardappelen"], "veggie": ["Schnitzel"]}, {"datum": "2026-10-06", "items": ["Groentensoep", "Boomstammetje", "Groene boontjes", "Rode kool", "Aardappelen"], "veggie": ["Quornfilet"]}, {"datum": "2026-10-08", "items": ["Saint-Germainsoep", "Balletjes", "Tomatensaus", "Gemengde sla", "Appelmoes", "Gestoomde aardappelen"], "veggie": ["Vege balletjes"]}, {"datum": "2026-10-09", "items": ["Tomatensoep", "Visnuggets", "Kruidenmayonaise", "Bladspinazie", "Pompoenpuree"], "veggie": ["Falafelburger"]}, {"datum": "2026-10-12", "items": ["Wortelsoep", "Kipbrochette", "Currysaus", "Wok Groenten", "Romanesco", "Rijst"], "veggie": ["Vege nuggets"]}, {"datum": "2026-10-13", "items": ["Vergetengroentesoep", "Mimosaburger", "Mosterdsausje", "Bonenmengeling", "Witte kool", "Tex mex aardappelen"], "veggie": ["Vege burger"]}, {"datum": "2026-10-15", "items": ["Witte bonensoep", "Kippegyros", "Coleslaw met rozijntjes", "Wortelen", "Puree"], "veggie": ["Vege gyros"]}, {"datum": "2026-10-16", "items": ["Broccolisoep", "Vege bolognaisesaus", "Pasta"], "veggie": ["Vege bolognaise"]}, {"datum": "2026-10-19", "items": ["Courgettesoep", "Gevogelte krokant", "Pittige tomatensaus", "Savooi in witte saus", "Gebakken groentemix", "Aardappelen"], "veggie": ["Shnitzel"]}, {"datum": "2026-10-20", "items": ["Parmentiersoep", "Spek en ham", "Carbonara", "Prei", "Pasta"], "veggie": ["Tikka masala vege"]}, {"datum": "2026-10-22", "items": ["Tomatensoep", "Vlaams stoofvlees", "Witloofsalade", "Gebakken witloof", "Puree"], "veggie": ["Vegetarische stoofvlees"]}, {"datum": "2026-10-23", "items": ["Preisoep", "Falafelburger", "Tartaarsaus", "Spinazie in de roomsaus", "Ratatouille", "Natuur aardappelen"], "veggie": ["Burger"]}, {"datum": "2026-10-26", "items": ["Kervelsoep", "Kipnuggets", "Zoet zure saus", "Wokgroenten", "Ananas", "Rijst"], "veggie": ["Nuggets"]}, {"datum": "2026-10-27", "items": ["Pompoensoep", "Balletjes", "Luiksesaus", "Gestoofde wortelen met tijm", "Gebakken champignons", "Natuur aardappelen"], "veggie": ["Provençaals stoofpotje met quorn"]}, {"datum": "2026-10-29", "items": ["Tomatensoep", "Kipfilet", "Thijmsaus", "Appelmoes", "Aardappelpuree"], "veggie": ["Quorn filet"]}, {"datum": "2026-10-30", "items": ["Kippensoep", "Bolognaise", "Lasagne"], "veggie": ["Vege lasagne"]}]};

// Hoeveel dagen er rechts naast de maaltijd van vandaag passen.
const MAX_VOORUIT = 3;
const HERLAAD_MS = 30 * 60 * 1000;

const WEEKDAGEN = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag",
                   "vrijdag", "zaterdag"];
const MAANDEN = ["januari", "februari", "maart", "april", "mei", "juni", "juli",
                 "augustus", "september", "oktober", "november", "december"];

function alsDatum(iso) {
  const [j, m, d] = iso.split("-").map(Number);
  return new Date(j, m - 1, d);
}
function dagVan(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function langeDatum(d) {
  return WEEKDAGEN[d.getDay()] + " " + d.getDate() + " " + MAANDEN[d.getMonth()];
}
function korteDatum(d) {
  return WEEKDAGEN[d.getDay()] + " " + d.getDate() + " " +
         MAANDEN[d.getMonth()].slice(0, 3);
}

function gerechtenGroot(dag) {
  let h = '<ul class="groot">';
  dag.items.forEach(i => { h += '<li>' + esc(i) + '</li>'; });
  h += '</ul>';
  if (dag.veggie && dag.veggie.length) {
    h += '<p class="veggiekop">Vegetarisch: ' +
         esc(dag.veggie.join(", ")) + '</p>';
  }
  return h;
}

// De dagen erna staan als één doorlopende regel. Een volledige lijst per dag
// past niet naast het menu van vandaag, en voor vooruitkijken volstaat de
// grote lijn.
function gerechtenKlein(dag) {
  let h = '<p class="kort">' + esc(dag.items.join(" · ")) + '</p>';
  if (dag.veggie && dag.veggie.length) {
    h += '<p class="kortveggie">Veggie: ' + esc(dag.veggie.join(", ")) + '</p>';
  }
  return h;
}

function teken() {
  const nu = new Date();
  const vandaag = dagVan(nu);
  document.getElementById("vandaag").textContent = langeDatum(nu);

  const komend = DATA.dagen.filter(d => alsDatum(d.datum) >= vandaag);
  const inhoud = document.getElementById("inhoud");

  if (komend.length === 0) {
    inhoud.innerHTML =
      '<p class="leeg">Geen menu beschikbaar. Kijk op www.basisschoolhetpark.be</p>';
    return;
  }

  const eerste = komend[0];
  const eersteDatum = alsDatum(eerste.datum);
  const isVandaag = eersteDatum.getTime() === vandaag.getTime();

  let html = '<section id="hoofd">' +
    '<p class="aanloop">' + (isVandaag ? "Vandaag" : "Volgende maaltijd") + '</p>' +
    '<p class="dagnaam">' + esc(langeDatum(eersteDatum)) + '</p>' +
    gerechtenGroot(eerste) +
    '</section>';

  const rest = komend.slice(1, 1 + MAX_VOORUIT);
  html += '<section id="later">';
  if (rest.length) {
    html += '<h2>De volgende dagen</h2><div class="rijen">';
    rest.forEach(d => {
      html += '<article><h3>' + esc(korteDatum(alsDatum(d.datum))) + '</h3>' +
              '<div class="gerechten">' + gerechtenKlein(d) +
              '</div></article>';
    });
    html += '</div>';
  }
  html += '</section>';

  inhoud.innerHTML = html;
}

// Een scherm dat maandenlang hetzelfde toont brandt in. Elke vijf minuten
// een paar pixels opschuiven is genoeg om dat te voorkomen.
const SCHUIF = [[0,0],[2,1],[3,0],[2,-1],[0,-2],[-2,-1],[-3,0],[-2,1]];
let schuifIndex = 0;
function pixelShift() {
  const [x, y] = SCHUIF[schuifIndex % SCHUIF.length];
  document.getElementById("scherm").style.transform =
    "translate(" + x + "px," + y + "px)";
  schuifIndex++;
}

teken();
pixelShift();
setInterval(teken, 60 * 1000);
setInterval(pixelShift, 5 * 60 * 1000);
setTimeout(() => location.reload(), HERLAAD_MS);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Menu Basisschool Het Park</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="scherm">
  <header>
    <div>
      <div class="merk">Basisschool Het Park</div>
      <div class="titel">Wat eten we vandaag</div>
    </div>
    <div class="vandaag" id="vandaag"></div>
  </header>

  <main id="inhoud">
    <noscript><p class="leeg">Zet JavaScript aan om het menu te tonen.</p></noscript>
  </main>

  <footer>
    <span>Volledig maandmenu op www.basisschoolhetpark.be</span>
    <span class="dim">Bijgewerkt op 15 september 2026</span>
  </footer>
</div>

<script>
const DATA = {"bijgewerkt_op": "2026-09-15", "bron": "echt.pdf", "dagen": [{"datum": "2026-09-01", "items": ["Groentesoep", "kipfilet", "Spaanse saus", "appelmoes", "romaneco in witte saus", "puree aardappelen"], "veggie": ["Quornfilet"]}, {"datum": "2026-09-03", "items": ["Courgettesoep", "Kalfsburger", "Stroganoffsaus", "Komkommerslaatje", "gestoomde aardappelen"], "veggie": ["Falafelburger"]}, {"datum": "2026-09-04", "items": ["Paprikasoep", "Griekse pastasalade", "boontjes - paparika - rode ajuin", "mini -tomaat", "Koude pastasalade"], "veggie": ["Griekse pastasalade"]}, {"datum": "2026-09-07", "items": ["Preisoep", "Kipdonut", "Bloemkool in witte saus", "Ratatouille", "Tex mex aardappelen"], "veggie": ["Falafel"]}, {"datum": "2026-09-08", "items": ["Tomatensoep", "Braadworst", "Uiensaus", "Erwten en Wortelen", "Witte kool", "Natuur aardappelen"], "veggie": ["Chipolata vegan"]}, {"datum": "2026-09-10", "items": ["Pompoensoep", "Vol Au Vent", "Mexicaans slaatje", "Gebakken aardappelen"], "veggie": ["Vol au Vegie"]}, {"datum": "2026-09-11", "items": ["kervelsoep", "Spek en ham", "Carbonarasaus", "Prei", "Pasta"], "veggie": ["Prei en kaassaus"]}, {"datum": "2026-09-14", "items": ["Pastinaaksoep", "Gevogeltekrokant", "Jonge wortelen", "Gebakken courgette", "Natuur aardappelen"], "veggie": ["Shnitzel"]}, {"datum": "2026-09-15", "items": ["Champignonroomsoep", "Kip", "tikka masala", "Brunoise groenten", "Gestoofde Broccoli", "rijst"], "veggie": ["Tikka masala vege"]}, {"datum": "2026-09-17", "items": ["Wortelsoep", "Balletjes", "Tomatensaus", "Coleslaw", "Gebakken aardappelen"], "veggie": ["Vegetarische balletjes"]}, {"datum": "2026-09-18", "items": ["Parmentiersoep", "Viskrokant", "Tartaarsaus", "Spinazie in de roomsaus", "Wortelpuree"], "veggie": ["Burger"]}, {"datum": "2026-09-21", "items": ["Groentesoep", "kipnuggets", "Appelmoes", "gestoofde boontjes", "Aardappelen"], "veggie": ["Nuggets"]}, {"datum": "2026-09-22", "items": ["kervelsoep", "boomstammetje", "Provençaalsesaus", "Bloemkool bechamelsaus", "gebakken aardapplen"], "veggie": ["Provençaals stoofpotje met quorn"]}, {"datum": "2026-09-24", "items": ["tomatensoep", "Kalkoengebraad", "champignonssaus", "witloofsalade", "puree"], "veggie": ["quorn filet"]}, {"datum": "2026-09-25", "items": ["broccolisoep", "No - Bull Bolognaise", "Pasta"], "veggie": ["Vege Bolognaisesaus"]}]};

// Hoeveel dagen er rechts naast de maaltijd van vandaag passen.
const MAX_VOORUIT = 3;
const HERLAAD_MS = 30 * 60 * 1000;

const WEEKDAGEN = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag",
                   "vrijdag", "zaterdag"];
const MAANDEN = ["januari", "februari", "maart", "april", "mei", "juni", "juli",
                 "augustus", "september", "oktober", "november", "december"];

function alsDatum(iso) {
  const [j, m, d] = iso.split("-").map(Number);
  return new Date(j, m - 1, d);
}
function dagVan(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function langeDatum(d) {
  return WEEKDAGEN[d.getDay()] + " " + d.getDate() + " " + MAANDEN[d.getMonth()];
}
function korteDatum(d) {
  return WEEKDAGEN[d.getDay()] + " " + d.getDate() + " " +
         MAANDEN[d.getMonth()].slice(0, 3);
}

function gerechtenGroot(dag) {
  let h = '<ul class="groot">';
  dag.items.forEach(i => { h += '<li>' + esc(i) + '</li>'; });
  h += '</ul>';
  if (dag.veggie && dag.veggie.length) {
    h += '<p class="veggiekop">Vegetarisch: ' +
         esc(dag.veggie.join(", ")) + '</p>';
  }
  return h;
}

// De dagen erna staan als één doorlopende regel. Een volledige lijst per dag
// past niet naast het menu van vandaag, en voor vooruitkijken volstaat de
// grote lijn.
function gerechtenKlein(dag) {
  let h = '<p class="kort">' + esc(dag.items.join(" · ")) + '</p>';
  if (dag.veggie && dag.veggie.length) {
    h += '<p class="kortveggie">Veggie: ' + esc(dag.veggie.join(", ")) + '</p>';
  }
  return h;
}

function teken() {
  const nu = new Date();
  const vandaag = dagVan(nu);
  document.getElementById("vandaag").textContent = langeDatum(nu);

  const komend = DATA.dagen.filter(d => alsDatum(d.datum) >= vandaag);
  const inhoud = document.getElementById("inhoud");

  if (komend.length === 0) {
    inhoud.innerHTML =
      '<p class="leeg">Geen menu beschikbaar. Kijk op www.basisschoolhetpark.be</p>';
    return;
  }

  const eerste = komend[0];
  const eersteDatum = alsDatum(eerste.datum);
  const isVandaag = eersteDatum.getTime() === vandaag.getTime();

  let html = '<section id="hoofd">' +
    '<p class="aanloop">' + (isVandaag ? "Vandaag" : "Volgende maaltijd") + '</p>' +
    '<p class="dagnaam">' + esc(langeDatum(eersteDatum)) + '</p>' +
    gerechtenGroot(eerste) +
    '</section>';

  const rest = komend.slice(1, 1 + MAX_VOORUIT);
  html += '<section id="later">';
  if (rest.length) {
    html += '<h2>De volgende dagen</h2><div class="rijen">';
    rest.forEach(d => {
      html += '<article><h3>' + esc(korteDatum(alsDatum(d.datum))) + '</h3>' +
              '<div class="gerechten">' + gerechtenKlein(d) +
              '</div></article>';
    });
    html += '</div>';
  }
  html += '</section>';

  inhoud.innerHTML = html;
}

// Een scherm dat maandenlang hetzelfde toont brandt in. Elke vijf minuten
// een paar pixels opschuiven is genoeg om dat te voorkomen.
const SCHUIF = [[0,0],[2,1],[3,0],[2,-1],[0,-2],[-2,-1],[-3,0],[-2,1]];
let schuifIndex = 0;
function pixelShift() {
  const [x, y] = SCHUIF[schuifIndex % SCHUIF.length];
  document.getElementById("scherm").style.transform =
    "translate(" + x + "px," + y + "px)";
  schuifIndex++;
}

teken();
pixelShift();
setInterval(teken, 60 * 1000);
setInterval(pixelShift, 5 * 60 * 1000);
setTimeout(() => location.reload(), HERLAAD_MS);
</script>

</body>
</html>
